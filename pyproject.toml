[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-people-runtime"
version = "0.1.0"
description = "CUDA TensorRT person detection and ReID runtime with gRPC session events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cupy-cuda12x>=13,<14", "tensorrt>=8.6,<11",
  "numpy>=1.24", "scipy>=1.10", "shapely>=2", "PyYAML>=6"
]

[project.entry-points."cv_demo.runtimes"]
"cv.people" = "cv_people.runtime:PeopleRuntime"

[tool.setuptools.packages.find]
where = ["src"]
